<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faculty Portal | SAtendify</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Faculty specific styling tweaks */
    .history-filter-controls {
      display: flex;
      gap: 16px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      background: white;
      padding: 16px 20px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      align-items: flex-end;
    }
    .history-filter-controls .form-group {
      margin-bottom: 0;
      flex-grow: 1;
      min-width: 140px;
    }
    @media (max-width: 768px) {
      .history-filter-controls {
        flex-direction: column;
        align-items: stretch;
        padding: 16px;
        gap: 12px;
      }
      .history-filter-controls .form-group {
        width: 100%;
        min-width: 0;
      }
      .history-filter-controls button {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div id="sidebar-container"></div>
    
    <div class="app-main">
      <div id="header-container"></div>
      
      <!-- Faculty Content Workplace Container -->
      <div id="dashboard-content" class="dashboard-content">
        <div class="panel-card">
          <div class="panel-header">
            <h3>Timetable Loading</h3>
          </div>
          <div class="panel-body">
            <span class="skeleton-bar" style="width: 100%; height: 200px;"></span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Shared Modal dialogue backdrop -->
  <div id="faculty-modal" class="modal-backdrop">
    <div class="modal-window" id="modal-window">
      <div class="modal-title-bar">
        <h4 id="modal-panel-title">Asset Form</h4>
        <button id="modal-close" class="modal-close-btn">&times;</button>
      </div>
      <form id="modal-form-element">
        <div class="modal-content-panel" id="modal-form-content">
          <!-- Populated dynamically -->
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" id="modal-cancel-btn">Cancel</button>
          <button type="submit" class="btn btn-primary" id="modal-save-btn">Save Record</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Primary Page Script Logic -->
  <script type="module" src="js/faculty.js"></script>

</body>
</html>
