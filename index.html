<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAtendify | Redirecting...</title>
</head>
<body style="background: #f8fafc; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
  <div style="text-align: center;">
    <div style="border: 4px solid #f3f3f3; border-top: 4px solid #2563eb; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 16px;"></div>
    <p style="color: #64748b; font-size: 0.95rem; font-weight: 500;">Directing to your SAtendify academic console...</p>
  </div>

  <style>
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>

  <script type="module">
    import { getCurrentUser } from './js/auth.js';
    
    // Check if session exists
    const user = getCurrentUser();
    if (user) {
      window.location.replace(`${user.role}.html`);
    } else {
      window.location.replace('login.html');
    }
  </script>
</body>
</html>
