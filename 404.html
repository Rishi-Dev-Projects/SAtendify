<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | SAtendify</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .error-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .error-card {
      max-width: 480px;
      background: white;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 48px 32px;
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .error-icon {
      font-size: 3.5rem;
      color: var(--color-accent);
      background: var(--color-accent-subtle);
      width: 80px;
      height: 80px;
      border-radius: var(--radius-round);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
    }
    .error-card h1 {
      font-size: 2rem;
      font-weight: 800;
      color: var(--text-primary);
    }
    .error-card p {
      color: var(--text-secondary);
      font-size: 0.95rem;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="error-container">
    <div class="error-card">
      <div class="error-icon">🔍</div>
      <h1>404 Not Found</h1>
      <p>The academic resource details or attendance schedule you are requesting could not be located in our database registers.</p>
      <button id="go-home-btn" class="btn btn-primary" style="margin-top: 12px; width: 100%;">Return to Home</button>
    </div>
  </div>

  <script type="module">
    import { getCurrentUser } from './js/auth.js';
    
    document.getElementById('go-home-btn').addEventListener('click', () => {
      const user = getCurrentUser();
      if (!user) {
        window.location.href = 'login.html';
      } else {
        window.location.href = `${user.role}.html`;
      }
    });
  </script>
</body>
</html>
