<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile | SAtendify</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .profile-hero {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      color: #ffffff;
      border-radius: var(--radius-lg);
      padding: 32px 28px;
      margin-bottom: 24px;
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      position: relative;
    }

    .profile-avatar-circle {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--color-accent) 0%, #818cf8 100%);
      color: #ffffff;
      font-size: 1.8rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 3px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.3);
      flex-shrink: 0;
    }

    .profile-detail-card {
      background: var(--bg-secondary);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-color);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      padding: 28px;
    }

    .profile-field-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .profile-field-item {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .profile-field-item:hover {
      border-color: var(--color-accent);
      box-shadow: 0 2px 10px rgba(79, 70, 229, 0.08);
    }

    .field-icon-box {
      width: 42px;
      height: 42px;
      border-radius: var(--radius-md);
      background: var(--color-accent-subtle);
      color: var(--color-accent);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .field-label {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 3px;
    }

    .field-value {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-primary);
      word-break: break-word;
    }

    .btn-back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 9px 18px;
      border-radius: var(--radius-md);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .btn-back-link:hover {
      background: rgba(255, 255, 255, 0.22);
      color: #ffffff;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div id="sidebar-container"></div>
    
    <div class="app-main">
      <div id="header-container"></div>
      
      <!-- Profile Dashboard Workspace Content -->
      <div id="dashboard-content" class="dashboard-content">
        
        <!-- Profile Header Hero -->
        <div class="profile-hero" id="profile-hero">
          <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 20px;">
            <div style="display: flex; align-items: center; gap: 20px;">
              <div class="profile-avatar-circle" id="hero-avatar">U</div>
              <div>
                <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 4px; flex-wrap: wrap;">
                  <h2 style="font-size: 1.6rem; font-weight: 800; margin: 0; color: #ffffff;" id="hero-name">Loading...</h2>
                  <span class="badge badge-primary" style="text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.5px;" id="hero-role-badge">ROLE</span>
                </div>
                <p style="margin: 0; color: rgba(255, 255, 255, 0.75); font-size: 0.9rem;" id="hero-subtext">SAtendify Academic Management System</p>
              </div>
            </div>
            <div>
              <button class="btn-back-link" id="btn-back-dashboard">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                Back to Dashboard
              </button>
            </div>
          </div>
        </div>

        <!-- Single Unified Profile Details Panel -->
        <div class="profile-detail-card">
          <div style="display: flex; align-items: center; gap: 10px; border-bottom: 2px solid var(--border-color); padding-bottom: 14px; margin-bottom: 8px;">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--color-accent)" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            <h3 style="margin: 0; font-size: 1.15rem; font-weight: 700; color: var(--text-primary);" id="profile-card-title">User Account & Role Profile</h3>
          </div>

          <div class="profile-field-grid" id="profile-field-grid">
            <!-- Dynamically populated via JS with SVG icons -->
          </div>
        </div>

      </div>
    </div>
  </div>

  <script type="module" src="js/profile.js"></script>
</body>
</html>
