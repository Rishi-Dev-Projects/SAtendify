<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Access Denied | SAtendify</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .error-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .error-card {
      max-width: 480px;
      background: white;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 48px 32px;
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .error-icon {
      font-size: 3.5rem;
      color: var(--color-danger);
      background: var(--color-danger-subtle);
      width: 80px;
      height: 80px;
      border-radius: var(--radius-round);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
    }
    .error-card h1 {
      font-size: 2rem;
      font-weight: 800;
      color: var(--text-primary);
    }
    .error-card p {
      color: var(--text-secondary);
      font-size: 0.95rem;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="error-container">
    <div class="error-card">
      <div class="error-icon">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--color-danger);"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
      </div>
      <h1>403 Forbidden</h1>
      <p>You do not have administrative clearance to access this department console or dashboard view. Please return to your designated role profile page.</p>
      <button id="go-back-btn" class="btn btn-primary" style="margin-top: 12px; width: 100%;">Return to My Dashboard</button>
    </div>
  </div>

  <script type="module">
    import { getCurrentUser } from './js/auth.js';
    
    document.getElementById('go-back-btn').addEventListener('click', () => {
      const user = getCurrentUser();
      if (!user) {
        window.location.href = 'login.html';
      } else {
        window.location.href = `${user.role}.html`;
      }
    });
  </script>
</body>
</html>
